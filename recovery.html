<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UPI Guardian - Recovery Mode</title>

    <link rel="stylesheet" href="recovery.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-header">

        <div class="brand">
            <div class="logo-shield">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <span>UPI Guardian</span>
        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="recovery-container">

        <section class="recovery-card">

            <!-- Recovery Mode Image -->

            <div class="recovery-image">
                <img src="img/recovery.png"
                     alt="Recovery Mode">
            </div>


            <!-- Small Label -->

            <div class="recovery-label">
                RECOVERY MODE
            </div>


            <!-- Heading -->

            <p class="already-scammed">
                Already Scammed?
            </p>

            <h1>
                Don’t Panic. Let’s Act Fast.
            </h1>


            <!-- Description -->

            <p class="description">
                We’ll guide you step-by-step to organize the incident,
                <br>
                secure your information, collect evidence, and begin the recovery process.
            </p>


            <!-- ================= STEPS ================= -->

            <div class="steps-container">

                <!-- STEP 1 -->

                <div class="step">

                    <div class="step-number">
                        1
                    </div>

                    <div class="step-card">

                        <div class="step-image">
                            <img src="img/step1.png"
                                 alt="Identify Transaction">
                        </div>

                        <p>
                            Identify the transaction
                        </p>

                    </div>

                </div>


                <!-- STEP 2 -->

                <div class="step">

                    <div class="step-number">
                        2
                    </div>

                    <div class="step-card">

                        <div class="step-image">
                            <img src="img/step2.png"
                                 alt="Take Immediate Action">
                        </div>

                        <p>
                            Take immediate action
                        </p>

                    </div>

                </div>


                <!-- STEP 3 -->

                <div class="step">

                    <div class="step-number">
                        3
                    </div>

                    <div class="step-card">

                        <div class="step-image">
                            <img src="img/step3.png"
                                 alt="Organize Evidence">
                        </div>

                        <p>
                            Organize evidence
                        </p>

                    </div>

                </div>

            </div>


            <!-- ================= START BUTTON ================= -->

            <button class="start-recovery" id="startRecovery">

                <span>Start Recovery</span>

                <i class="fa-solid fa-arrow-right"></i>

            </button>


            <!-- ================= BACK ================= -->

            <button class="back-dashboard" id="backDashboard">

                <i class="fa-solid fa-arrow-left"></i>

                <span>Back to Dashboard</span>

            </button>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="recovery.js"></script>

</body>
</html>
