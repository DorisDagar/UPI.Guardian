<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Guardian - Login</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo-section" role="link" tabindex="0" onclick="window.location.href='index.html'">
            <img src="img/logo.png" alt="UPI Guardian Logo" class="logo-img">
            <div class="logo-text">
                <h1>UPI <span>Guardian</span></h1>
                <p>Explain Before You Pay</p>
            </div>
        </div>
        <div class="nav-buttons">
            <a href="login.html" class="login">Login</a>
            <button class="get-started-btn" type="button" onclick="window.location.href='signup.html'">Get Started</button>
        </div>
    </header>

    <main class="main-container">
        <section class="left-section">
            <h1>Secure Every Payment,<br><span>Every Time.</span></h1>
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-icon"><i class="fa-solid fa-shield"></i></span>
                <div class="divider-line"></div>
            </div>
            <p class="description">UPI Guardian protects you from fraud<br>and keeps your money safe.</p>
            <div class="shield-area">
                <img src="img/secure.jpeg" alt="UPI Guardian Shield" class="shield-image">
            </div>
        </section>

        <form class="login-card" id="loginForm">
            <div class="logo-image">
                <img src="img/logo.png" alt="UPI Guardian Logo">
            </div>
            <h1>Welcome Back!</h1>
            <p class="login-text">Login to continue to your secure account</p>
            <div class="login-options">
                <button class="login-option active" type="button">Login</button>
                <button class="login-option" type="button" onclick="window.location.href='signup.html'">Sign Up</button>
            </div>
            <label for="email">Email Address</label>
            <div class="email-input">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="Enter your email address" autocomplete="email" required>
            </div>
            <label for="password">Password</label>
            <input type="password" id="password" class="password-input" placeholder="Enter your password" autocomplete="current-password" required>
            <div class="forgot-password"><a href="#" onclick="return false;">Forgot Password?</a></div>
            <button class="login-button" id="loginBtn" type="submit">
                <span>Login</span><i class="fa-solid fa-arrow-right"></i>
            </button>
            <div class="or"><div class="or-line"></div><span>OR</span><div class="or-line"></div></div>
            <button class="google-button" type="button" title="Google login is not connected yet">
                <i class="fa-brands fa-google"></i>Continue with Google
            </button>
            <p class="security"><i class="fa-solid fa-lock"></i>Your data is secure with us</p>
        </form>
    </main>
    <script src="login.js"></script>
</body>
</html>
